version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - mern-network

  user-service:
    build: ./backend/user-service
    container_name: user-service
    restart: unless-stopped
    ports:
      - '5001:5001'
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongo:27017/userdb
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key_change_me}
      - NODE_ENV=production
    depends_on:
      - mongo
    networks:
      - mern-network

  task-service:
    build: ./backend/task-service
    container_name: task-service
    restart: unless-stopped
    ports:
      - '5002:5002'
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://mongo:27017/taskdb
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key_change_me}
      - NODE_ENV=production
    depends_on:
      - mongo
    networks:
      - mern-network

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - REACT_APP_USER_SERVICE_URL=http://localhost:5001
      - REACT_APP_TASK_SERVICE_URL=http://localhost:5002
    depends_on:
      - user-service
      - task-service
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge

volumes:
  mongo_data:
