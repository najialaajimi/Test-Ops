apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mern-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.45.0
          ports:
            - containerPort: 9090
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-storage
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mern-app
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mern-app
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'gateway-service'
        static_configs:
          - targets: ['gateway-service:3000']
        metrics_path: '/metrics'
      - job_name: 'user-service'
        static_configs:
          - targets: ['user-service:3001']
        metrics_path: '/metrics'
      - job_name: 'category-service'
        static_configs:
          - targets: ['category-service:3002']
        metrics_path: '/metrics'
      - job_name: 'product-service'
        static_configs:
          - targets: ['product-service:3003']
        metrics_path: '/metrics'
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter:9100']
